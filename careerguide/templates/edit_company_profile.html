{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Company Profile</title>

    <link rel="stylesheet" href="{% static 'css/editcompanyprofile.css' %}">
    
</head>
<body>
<form method="POST" enctype="multipart/form-data" class="container-fluid px-2 px-sm-3 px-md-4 my-4">
    {% csrf_token %}

    <div class="card shadow-sm p-3 p-md-4 mb-4 bg-white rounded border-0">
        <h2 class="mb-4 text-center text-md-start fs-3 fs-md-2">Company Information</h2>

        <div class="row g-3">
            <!-- Company Name -->
            <div class="col-12 col-md-6">
                <label class="form-label fw-bold">Company Name</label>
                <input type="text" name="company_name" class="form-control" value="{{ company.company_name }}" required>
            </div>

            <!-- Email -->
            <div class="col-12 col-md-6">
                <label class="form-label fw-bold">Email</label>
                <input type="email" name="email" class="form-control" value="{{ company.email }}" required>
            </div>
        </div>

        <div class="row g-3 mt-1">
            <!-- Phone -->
            <div class="col-12 col-md-6">
                <label class="form-label fw-bold">Phone</label>
                <input type="text" name="phone" class="form-control" value="{{ company.phone }}">
            </div>

            <!-- Website -->
            <div class="col-12 col-md-6">
                <label class="form-label fw-bold">Website</label>
                <input type="text" name="website" class="form-control" value="{{ company.website }}">
            </div>
        </div>

        <!-- Address -->
        <div class="mt-3">
            <label class="form-label fw-bold">Address</label>
            <input type="text" name="address" class="form-control" value="{{ company.address }}">
        </div>

        <!-- Description -->
        <div class="mt-3">
            <label class="form-label fw-bold">Description</label>
            <textarea name="description" class="form-control" rows="4">{{ company.description }}</textarea>
        </div>

        <!-- Tagline -->
        <div class="mt-3">
            <label class="form-label fw-bold">Tagline (Optional)</label>
            <input type="text" name="tagline" class="form-control" value="{{ company.tagline|default:'' }}" placeholder="e.g. Building better careers">
        </div>

        <div class="row g-3 mt-1">
            <!-- Facebook Username -->
            <div class="col-12 col-md-4">
                <label class="form-label fw-bold">Facebook Username</label>
                <input type="text" name="facebook" class="form-control" value="{{ company.facebook|default:'' }}" placeholder="companyname">
            </div>

            <!-- Twitter Username -->
            <div class="col-12 col-md-4">
                <label class="form-label fw-bold">Twitter Username</label>
                <input type="text" name="twitter" class="form-control" value="{{ company.twitter|default:'' }}" placeholder="@companyname">
            </div>

            <!-- LinkedIn Username -->
            <div class="col-12 col-md-4">
                <label class="form-label fw-bold">LinkedIn Username</label>
                <input type="text" name="linkedin" class="form-control" value="{{ company.linkedin|default:'' }}" placeholder="companyname">
            </div>
        </div>

        <!-- Profile Image Section -->
        <div class="mt-4">
            <label class="form-label fw-bold d-block">Profile Image</label>

            <!-- Responsive Image Containers wrapper -->
            <div class="image-preview-container">


 {% if company.profile_image %}


<div>

<p>Current Image</p>
<img src="{{ company.profile_image.url }}"
class="preview-img">
</div>
{% endif %}
<div>
<p>New Image</p>
<img id="new-image-preview"
src="{% static 'images/default-profile.jpg' %}"
class="preview-img">
</div>


</div>

            <div class="input-group">
                <input type="file" name="profile_image" id="profile-image-input" accept="image/*" class="form-control">
            </div>
        </div>

    </div>

    <!-- Action Buttons: Stack on mobile, side-by-side on larger screens -->
    <div class="d-flex flex-column-reverse flex-sm-row justify-content-between align-items-stretch gap-2 px-1">
        <a href="{% url 'companyprofile' company.id %}" class="back-btn btn btn-secondary px-4 py-2 text-center text-decoration-none">
            Back
        </a>
        <button type="submit" class="profile-btn btn btn-primary px-4 py-2">
            Update Profile
        </button>
    </div>

</form>

<script>

const imageInput = document.getElementById("profile-image-input");
const previewImage = document.getElementById("new-image-preview");


imageInput.addEventListener("change", function(){

    const file = this.files[0];

    if(file){

        const reader = new FileReader();

        reader.onload = function(e){

            previewImage.src = e.target.result;

        }

        reader.readAsDataURL(file);

    }

});

</script>
</body>
</html>
