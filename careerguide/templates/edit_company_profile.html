{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Company Profile</title>

    <link rel="stylesheet" href="{% static 'css/editcompanyprofile.css' %}">
    
</head>
<body>
<form method="POST" enctype="multipart/form-data" class="container my-4 px-3 px-md-0">
    {% csrf_token %}

    <div class="card shadow-sm p-3 p-md-4 mb-4 bg-white rounded">
        <h2 class="mb-4 text-center text-md-start">Company Information</h2>

        <div class="row">
            <!-- Company Name -->
            <div class="col-12 col-md-6 mb-3">
                <label class="form-label font-weight-bold">Company Name</label>
                <input type="text" name="company_name" class="form-control" value="{{ company.company_name }}" required>
            </div>

            <!-- Email -->
            <div class="col-12 col-md-6 mb-3">
                <label class="form-label font-weight-bold">Email</label>
                <input type="email" name="email" class="form-control" value="{{ company.email }}" required>
            </div>
        </div>

        <div class="row">
            <!-- Phone -->
            <div class="col-12 col-md-6 mb-3">
                <label class="form-label font-weight-bold">Phone</label>
                <input type="text" name="phone" class="form-control" value="{{ company.phone }}">
            </div>

            <!-- Website -->
            <div class="col-12 col-md-6 mb-3">
                <label class="form-label font-weight-bold">Website</label>
                <input type="text" name="website" class="form-control" value="{{ company.website }}">
            </div>
        </div>

        <!-- Address -->
        <div class="mb-3">
            <label class="form-label font-weight-bold">Address</label>
            <input type="text" name="address" class="form-control" value="{{ company.address }}">
        </div>

        <!-- Description -->
        <div class="mb-3">
            <label class="form-label font-weight-bold">Description</label>
            <textarea name="description" class="form-control" rows="4">{{ company.description }}</textarea>
        </div>

        <!-- Tagline -->
        <div class="mb-3">
            <label class="form-label font-weight-bold">Tagline (Optional)</label>
            <input type="text" name="tagline" class="form-control" value="{{ company.tagline|default:'' }}" placeholder="e.g. Building better careers">
        </div>

        <div class="row">
            <!-- Facebook Username -->
            <div class="col-12 col-md-4 mb-3">
                <label class="form-label font-weight-bold">Facebook Username</label>
                <input type="text" name="facebook" class="form-control" value="{{ company.facebook|default:'' }}" placeholder="companyname">
            </div>

            <!-- Twitter Username -->
            <div class="col-12 col-md-4 mb-3">
                <label class="form-label font-weight-bold">Twitter Username</label>
                <input type="text" name="twitter" class="form-control" value="{{ company.twitter|default:'' }}" placeholder="@companyname">
            </div>

            <!-- LinkedIn Username -->
            <div class="col-12 col-md-4 mb-3">
                <label class="form-label font-weight-bold">LinkedIn Username</label>
                <input type="text" name="linkedin" class="form-control" value="{{ company.linkedin|default:'' }}" placeholder="companyname">
            </div>
        </div>

        <!-- Profile Image Section -->
        <div class="mb-3">
            <label class="form-label font-weight-bold d-block">Profile Image</label>

            <div class="image-preview-container d-flex flex-wrap gap-4 my-3 align-items-center justify-content-center justify-content-sm-start">
                {% if company.profile_image %}
                <div class="text-center">
                    <p class="text-muted small mb-1">Current Image</p>
                    <img src="{{ company.profile_image.url }}" class="preview-img img-thumbnail" style="width: 120px; height: 120px; object-fit: cover;">
                </div>
                {% endif %}

                <div class="text-center">
                    <p class="text-muted small mb-1">New Image</p>
                    <img id="new-image-preview" src="{% static 'images/default-profile.jpg' %}" class="preview-img img-thumbnail" style="width: 120px; height: 120px; object-fit: cover;">
                </div>
            </div>

            <input type="file" name="profile_image" id="profile-image-input" accept="image/*" class="form-control mt-2">
        </div>

    </div>

    <!-- Action Buttons -->
    <div class="d-flex flex-column-reverse flex-sm-row justify-content-between align-items-stretch align-items-sm-center gap-2">
        <a href="{% url 'companyprofile' company.id %}" class="back-btn btn btn-secondary px-4 py-2 text-center text-decoration-none">
            Back
        </a>
        <button type="submit" class="profile-btn btn btn-primary px-4 py-2">
            Update Profile
        </button>
    </div>

</form>

<script>

const imageInput = document.getElementById("profile-image-input");
const previewImage = document.getElementById("new-image-preview");


imageInput.addEventListener("change", function(){

    const file = this.files[0];

    if(file){

        const reader = new FileReader();

        reader.onload = function(e){

            previewImage.src = e.target.result;

        }

        reader.readAsDataURL(file);

    }

});

</script>
</body>
</html>
